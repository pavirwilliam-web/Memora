<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF7FC;
    --card: #FFFFFF;
    --lavender: #A78BFA;
    --lavender-soft: #EDE6FC;
    --mint: #8FD9C4;
    --mint-soft: #E3F7F1;
    --peach: #FFC9B3;
    --peach-soft: #FFEFE7;
    --gold: #F5C451;
    --text: #2D2A3D;
    --muted: #8B87A3;
    --border: #ECE7F5;
    --danger: #E8747A;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 8px 24px rgba(167,139,250,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: var(--bg); color: var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2,h3,h4{ font-family:'Poppins', sans-serif; margin:0; }
  #app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  .header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px 12px; background: linear-gradient(135deg, var(--lavender-soft), var(--mint-soft)); gap:8px; }
  .logo-row{ display:flex; align-items:center; gap:9px; }
  .logo-mark{ width:36px;height:36px;border-radius:11px; background: linear-gradient(135deg, var(--lavender), var(--peach)); display:flex;align-items:center;justify-content:center; color:white; font-family:'Poppins',sans-serif; font-weight:800; font-size:17px; box-shadow: var(--shadow); transform: rotate(-4deg); flex-shrink:0; }
  .brand{ font-size:19px; font-weight:800; letter-spacing:-0.02em; }
  .user-chip{ display:flex; align-items:center; gap:6px; background:white; padding:5px 10px 5px 5px; border-radius:999px; font-size:12px; font-weight:600; box-shadow: var(--shadow); cursor:pointer; border:none; white-space:nowrap; }
  .points-badge{ color: var(--lavender); font-weight:800; }
  main{ flex:1; padding: 16px 74px 24px 18px; }
  .card{ background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; border: 1px solid var(--border); }
  .section-title{ font-size:21px; font-weight:800; margin-bottom:4px; }
  .section-sub{ color:var(--muted); font-size:13.5px; margin-bottom:16px; }
  input[type=text], input[type=password], textarea, select{ width:100%; border: 1.5px solid var(--border); background: #FBFAFE; border-radius: var(--radius-sm); padding: 11px 13px; font-family:'Inter',sans-serif; font-size:14.5px; color: var(--text); outline:none; transition: border-color .15s; }
  input:focus, textarea:focus, select:focus{ border-color: var(--lavender); }
  textarea{ min-height:90px; resize:vertical; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:7px; border:none; border-radius: 999px; padding: 11px 18px; font-family:'Inter',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; transition: transform .1s, filter .1s; }
  .btn:active{ transform: scale(0.96); filter: brightness(0.85); }
  .btn-primary{ background: var(--lavender); color:white; }
  .btn-mint{ background: var(--mint); color:white; }
  .btn-peach{ background: var(--peach); color: #6B3A2C; }
  .btn-gold{ background: var(--gold); color:#5C4008; }
  .btn-outline{ background:white; color:var(--text); border:1.5px solid var(--border); }
  .btn-danger{ background: var(--danger); color:white; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:7px 12px; font-size:12px; }
  .btn[disabled]{ opacity:.5; cursor:default; }
  .row{ display:flex; gap:9px; }
  .wrap{ flex-wrap:wrap; }
  .tag{ display:inline-block; font-size:10.5px; font-weight:700; background: var(--peach-soft); color:#B0603F; padding:4px 10px; border-radius:999px; margin:0 6px 6px 0; }
  .tag-mint{ background: var(--mint-soft); color:#2E9C7F; }
  .tag-lav{ background: var(--lavender-soft); color:#6D4FC4; }
  .notion-item{ padding:13px; border-radius: var(--radius-sm); background:#FBFAFE; border:1px solid var(--border); margin-bottom:9px; cursor:pointer; }
  .notion-item:active{ background: var(--lavender-soft); }
  .notion-title{ font-weight:700; font-size:14.5px; margin-bottom:2px; }
  .notion-cat{ font-size:11.5px; color:var(--muted); }
  .notion-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:4px; }
  .empty{ text-align:center; padding: 26px 10px; color:var(--muted); font-size:13.5px; }
  .empty-emoji{ font-size:32px; margin-bottom:8px; }
  nav.tabbar{ position:fixed; top:50%; right:14px; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:11px; z-index:40; max-height:88vh; overflow-y:auto; padding:2px; }
  .tab-circle{ width:46px; height:46px; border-radius:50%; background:white; border:none; display:flex; align-items:center; justify-content:center; color:var(--muted); box-shadow: var(--shadow); cursor:pointer; flex-shrink:0; transition: background .15s, color .15s, transform .1s; }
  .tab-circle svg{ width:20px; height:20px; }
  .tab-circle.active{ background: linear-gradient(135deg, var(--lavender), var(--peach)); color:white; }
  .tab-circle:active{ transform: scale(0.9); }
  .option-btn{ display:block; width:100%; text-align:left; padding:11px 13px; margin-bottom:7px; border-radius: var(--radius-sm); border:1.5px solid var(--border); background:#FBFAFE; font-family:'Inter',sans-serif; font-size:13.5px; font-weight:500; color:var(--text); cursor:pointer; }
  .option-btn.selected{ border-color: var(--lavender); background: var(--lavender-soft); font-weight:700; }
  .option-btn.correct{ border-color:#4CAF7D; background:#E4F7ED; font-weight:700; }
  .option-btn.wrong{ border-color: var(--danger); background:#FBEAEB; font-weight:700; }
  .msg{ display:flex; flex-direction:column; margin-bottom:9px; max-width:82%; }
  .msg.mine{ align-self:flex-end; align-items:flex-end; margin-left:auto; }
  .msg-bubble{ background:#FBFAFE; border:1px solid var(--border); border-radius:14px; padding:9px 12px; font-size:13.5px; }
  .msg.mine .msg-bubble{ background: var(--lavender-soft); }
  .msg-name{ font-size:10.5px; color:var(--muted); margin-bottom:2px; font-weight:700; }
  .msg-actions{ display:flex; gap:6px; margin-top:3px; }
  .msg-action-btn{ font-size:10px; color:var(--muted); background:none; border:none; cursor:pointer; padding:2px 4px; }
  .chat-list{ display:flex; flex-direction:column; height:calc(100vh - 340px); min-height:240px; overflow-y:auto; margin-bottom:12px; padding-right:2px;}
  .spinner{ width:17px;height:17px;border-radius:50%; border:3px solid rgba(255,255,255,0.4); border-top-color:white; animation: spin .7s linear infinite; display:inline-block; }
  .spinner-dark{ border:3px solid var(--border); border-top-color: var(--lavender); }
  @keyframes spin{ to{ transform: rotate(360deg);} }
  .name-gate{ position:fixed; inset:0; background: linear-gradient(160deg, var(--lavender-soft), var(--mint-soft)); display:flex; align-items:center; justify-content:center; padding:24px; z-index:50; overflow-y:auto; }
  .name-gate-card{ background:white; border-radius:24px; padding:30px 22px; max-width:360px; width:100%; box-shadow: 0 20px 50px rgba(167,139,250,0.25); text-align:center; }
  .file-drop{ border:2px dashed var(--border); border-radius: var(--radius-sm); padding:20px; text-align:center; color:var(--muted); font-size:13.5px; cursor:pointer; background:#FBFAFE; }
  .exo-item{ background:#FBFAFE; border:1px solid var(--border); border-radius: var(--radius-sm); padding:12px 13px; margin-bottom:9px; }
  .divider{ height:1px; background:var(--border); margin:14px 0; }
  .toast{ position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background: var(--text); color:white; padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600; z-index:60; box-shadow:var(--shadow); max-width:88%; text-align:center; }
  .leader-row{ display:flex; align-items:center; gap:11px; padding:10px 6px; border-bottom:1px solid var(--border); }
  .leader-rank{ width:25px; height:25px; border-radius:50%; background:var(--lavender-soft); color:var(--lavender); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:11.5px; flex-shrink:0; }
  small.hint{ color:var(--muted); font-size:12px; display:block; margin-top:4px; }
  label.field-label{ font-size:12px; font-weight:700; color:var(--muted); display:block; margin-bottom:5px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .flash-card{ background: linear-gradient(135deg, var(--lavender-soft), var(--mint-soft)); border-radius: var(--radius); padding:34px 20px; min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:700; font-size:16px; margin-bottom:16px; box-shadow:var(--shadow); user-select:none; touch-action:pan-y; }
  .flash-progress{ text-align:center; color:var(--muted); font-size:12.5px; margin-bottom:10px; font-weight:600; }
  .streak-banner{ background: linear-gradient(135deg,var(--peach),var(--gold)); color:#5C3A1A; border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; font-weight:700; box-shadow:var(--shadow); }
  .pending-item{ background:#FFF8E9; border:1.5px solid var(--gold); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(45,42,61,0.45); display:none; align-items:flex-end; justify-content:center; z-index:100; padding:0; }
  .modal-card{ background:white; border-radius: 22px 22px 0 0; padding:22px; max-width:520px; width:100%; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); max-height:80vh; overflow-y:auto; }
  .avatar-mini-letter{ width:22px;height:22px;border-radius:50%; background:var(--lavender); color:white; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; flex-shrink:0; }
  .edit-field-row{ margin-bottom:10px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// Detection : sommes-nous dans l'apercu Claude (artefact) ou sur un vrai hebergement
// avec le backend fourni ? Cela permet de tester ici, tout en utilisant le vrai backend
// une fois deploye (voir memora-backend/README.md).
const IN_ARTIFACT_PREVIEW = !!(window.storage && typeof window.storage.set === 'function');

function getToken(){ return localStorage.getItem('memora-token') || null; }
function getUsername(){ return localStorage.getItem('memora-username') || null; }
function setSession(token, username, isAdmin){
  localStorage.setItem('memora-token', token);
  localStorage.setItem('memora-username', username);
}
function clearSession(){ localStorage.removeItem('memora-token'); localStorage.removeItem('memora-username'); setStoredIsAdmin(false); }
function authHeaders(){ const t = getToken(); return t ? { 'Authorization': 'Bearer '+t } : {}; }

// Le code admin, une fois validé pour un compte, est mémorisé localement pour ce compte
// précis : plus besoin de le retaper à chaque visite. Il est effacé à la déconnexion.
function getStoredIsAdmin(){
  return localStorage.getItem('memora-isadmin')==='1' && localStorage.getItem('memora-isadmin-for')===getUsername();
}
function setStoredIsAdmin(isAdmin, username){
  if(isAdmin){ localStorage.setItem('memora-isadmin','1'); localStorage.setItem('memora-isadmin-for', username||getUsername()||''); }
  else{ localStorage.removeItem('memora-isadmin'); localStorage.removeItem('memora-isadmin-for'); }
}

// Safe storage : en apercu Claude on utilise window.storage (partage entre utilisateurs
// de l'artefact). Une fois deploye avec le backend, tout passe par /api/storage, qui est
// vraiment partage entre tous les visiteurs de ton site (contrairement a localStorage seul).
const safeStorage = {
  async get(key, shared, tokenOverride){
    if(IN_ARTIFACT_PREVIEW){ try{ return await window.storage.get(key, shared); }catch(e){ return { value:null }; } }
    try{
      const headers = tokenOverride ? { 'Authorization': 'Bearer '+tokenOverride } : authHeaders();
      const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}&shared=${!!shared}`, { headers });
      if(!res.ok) return { value:null };
      return await res.json();
    }catch(e){ return { value:null }; }
  },
  async set(key, val, shared, tokenOverride){
    // IMPORTANT : renvoie maintenant true/false selon que l'écriture a vraiment réussi.
    // Avant, une erreur ou un 401/500 côté serveur était avalée silencieusement : l'admin
    // voyait "Notion supprimée / mise à jour" alors que rien n'avait été sauvegardé, et la
    // notion réapparaissait au rechargement. C'était la cause du bug de suppression/édition.
    if(IN_ARTIFACT_PREVIEW){ try{ await window.storage.set(key, val, shared); return true; }catch(e){ console.error('storage.set failed', e); return false; } }
    try{
      const headers = { 'Content-Type':'application/json', ...(tokenOverride ? { 'Authorization': 'Bearer '+tokenOverride } : authHeaders()) };
      const res = await fetch('/api/storage', { method:'POST', headers, body: JSON.stringify({ key, value: val, shared: !!shared }) });
      return res.ok;
    }catch(e){ console.error('storage.set failed', e); return false; }
  },
  async delete(key, shared, tokenOverride){
    if(IN_ARTIFACT_PREVIEW){ try{ await window.storage.delete(key, shared); return true; }catch(e){ return false; } }
    try{
      const headers = tokenOverride ? { 'Authorization': 'Bearer '+tokenOverride } : authHeaders();
      const res = await fetch(`/api/storage?key=${encodeURIComponent(key)}&shared=${!!shared}`, { method:'DELETE', headers });
      return res.ok;
    }catch(e){ return false; }
  },
  async list(prefix, shared){
    if(IN_ARTIFACT_PREVIEW){ try{ return await window.storage.list(prefix, shared); }catch(e){ return { keys:[] }; } }
    try{
      const res = await fetch(`/api/storage/list?prefix=${encodeURIComponent(prefix)}&shared=${!!shared}`, { headers: authHeaders() });
      if(!res.ok) return { keys:[] };
      return await res.json();
    }catch(e){ return { keys:[] }; }
  }
};

// ================= Anthropic API helpers =================
// En apercu Claude : appel direct (gere automatiquement par le bac a sable de Claude.ai).
// Une fois deploye avec le backend fourni : appel a /api/ask, qui garde ta cle API secrete
// cote serveur (jamais visible dans le navigateur).
async function askClaude(messages, opts={}){
  const body = { model:"claude-sonnet-4-6", max_tokens: opts.maxTokens || 1000, messages };
  if(opts.system) body.system = opts.system;
  if(opts.tools) body.tools = opts.tools;
  if(IN_ARTIFACT_PREVIEW){
    const res = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    return (data.content||[]).map(b=>b.text||"").filter(Boolean).join("\n");
  }
  const res = await fetch('/api/ask', { method:'POST', headers:{ 'Content-Type':'application/json', ...authHeaders() }, body: JSON.stringify(body) });
  const data = await res.json();
  if(res.status===401){ clearSession(); setState({ accessGranted:false }); throw new Error("Session expirée, reconnecte-toi."); }
  if(data.error) throw new Error(data.error);
  return data.text || "";
}
async function askClaudeWithWebSearch(messages, opts={}){
  return askClaude(messages, {...opts, tools:[{type:"web_search_20250305", name:"web_search"}], maxTokens: opts.maxTokens || 1500});
}

// ================= Auth helpers =================
// En apercu Claude : compte simule via window.storage, uniquement pour tester l'interface ici.
// Une fois deploye : vraies requetes au backend, mots de passe haches (bcrypt) cote serveur.
async function apiRegister(username, password){
  username = (username||"").trim();
  if(IN_ARTIFACT_PREVIEW){
    const key = 'preview-account:'+normalize(username);
    const existing = await getJSON(key, true);
    if(existing) return { error: "Ce nom d'utilisateur existe déjà." };
    await setJSON(key, { password, isAdmin:false }, true);
    return { token:'preview.'+normalize(username), username, isAdmin:false };
  }
  const res = await fetch('/api/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
  return await res.json();
}
async function apiLogin(username, password){
  username = (username||"").trim();
  if(IN_ARTIFACT_PREVIEW){
    const key = 'preview-account:'+normalize(username);
    const account = await getJSON(key, true);
    if(!account || account.password !== password) return { error: "Identifiants incorrects." };
    return { token:'preview.'+normalize(username), username, isAdmin: !!account.isAdmin };
  }
  const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
  return await res.json();
}
async function apiAdminCheck(code){
  if(IN_ARTIFACT_PREVIEW){
    // Test uniquement : dans l'apercu on ne connaît pas ton vrai code secret cote serveur,
    // donc n'importe quel code non vide passe ici pour te laisser voir l'onglet Admin.
    return { isAdmin: !!code };
  }
  const res = await fetch('/api/auth/admin-check', { method:'POST', headers:{'Content-Type':'application/json', ...authHeaders()}, body: JSON.stringify({ code }) });
  return await res.json();
}

function parseJsonLoose(text){
  const cleaned = text.replace(/```json|```/g,"").trim();
  const start = cleaned.indexOf("{"); const end = cleaned.lastIndexOf("}");
  let candidate = cleaned;
  if(start !== -1 && end !== -1) candidate = cleaned.slice(start, end+1);
  try{ return JSON.parse(candidate); }catch(e){ return null; }
}
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result.split(",")[1]);
    r.onerror = ()=> reject(new Error("Lecture du fichier impossible"));
    r.readAsDataURL(file);
  });
}
function normalize(str){ return (str||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

// ================= Compte admin de secours (bootstrap) =================
// CHANGE CES DEUX VALEURS avant de mettre le site en ligne. Ce compte donne un accès admin
// total dès la connexion (sans code de validation), quel que soit l'état du backend — c'est
// la solution de secours pour ne jamais rester bloqué dehors.
const MASTER_ADMIN_USERNAME = "jos@";
const MASTER_ADMIN_PASSWORD = "joswilk@1868";
function isMasterAdmin(){ return normalize(state.userName)===normalize(MASTER_ADMIN_USERNAME); }
// Code que les utilisateurs normaux entrent dans l'onglet Admin pour devenir admin.
// Le compte de secours ci-dessus peut le consulter/changer et retirer l'accès à qui il veut.
async function checkAdminCode(code){
  if(!code) return false;
  const stored = await getJSON('admin-code', true);
  const validCode = (stored && stored.code) ? stored.code : "2545"; // code par défaut tant qu'il n'a pas été personnalisé
  return code === validCode;
}
async function resolveIsAdmin(username){
  if(!username) return false;
  if(normalize(username)===normalize(MASTER_ADMIN_USERNAME)) return true;
  const list = await getJSON('admin-usernames', true);
  if(list && list.includes(normalize(username))) return true;
  return getStoredIsAdmin(); // repli hors-ligne si le stockage partagé est injoignable
}
// ================= Bannissement & registre des comptes =================
async function isBanned(username){
  if(normalize(username)===normalize(MASTER_ADMIN_USERNAME)) return false;
  const list = (await getJSON('banned-usernames', true)) || [];
  return list.includes(normalize(username));
}
async function trackUserSighting(username){
  const norm = normalize(username);
  if(!norm || norm===normalize(MASTER_ADMIN_USERNAME)) return;
  const list = (await getJSON('all-users', true)) || [];
  if(!list.find(u=>u.norm===norm)){
    list.push({ norm, username, firstSeen: Date.now() });
    await setJSON('all-users', list, true);
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function isScientific(category){
  const c = normalize(category||"");
  return ["math","physi","chimi","science"].some(k=>c.includes(k));
}
function scientificInstruction(category){
  if(!isScientific(category)) return "";
  return " Comme il s'agit de mathématiques, physique ou chimie, détaille rigoureusement chaque étape du raisonnement (formules utilisées, calculs intermédiaires, unités) dans les explications et corrections.";
}

// ================= State =================
let state = {
  accessGranted:false, userName:null,
  screen:"recherche", notionsIndex:[], currentNotion:null,
  points:0, isAdmin:false, loading:false, toastMsg:null,
  streak:{count:0}, missed:[],
};

function setState(patch){ state = {...state, ...patch}; render(); }
function showToast(msg){ setState({toastMsg: msg}); setTimeout(()=>{ if(state.toastMsg===msg) setState({toastMsg:null}); }, 2400); }
function renderInPlace(){ const m=document.getElementById('main'); if(m){ m.innerHTML = renderScreen(); bindScreen(); } }
function escapeHtml(s){ const d=document.createElement('div'); d.innerText = s==null?"":String(s); return d.innerHTML; }

// ================= Modal =================
function ensureModalOverlay(){
  let overlay = document.getElementById('app-modal-overlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'app-modal-overlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  return overlay;
}
function openModal(innerHtml){
  const overlay = ensureModalOverlay();
  overlay.innerHTML = `<div class="modal-card">${innerHtml}</div>`;
  overlay.style.display = 'flex';
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
}
function closeModal(){ const overlay = document.getElementById('app-modal-overlay'); if(overlay) overlay.style.display='none'; }
function showConfirmModal(message, onConfirm){
  openModal(`
    <p style="margin-bottom:16px; font-size:14.5px;">${escapeHtml(message)}</p>
    <div class="row"><button class="btn btn-outline btn-block" id="modal-cancel">Annuler</button><button class="btn btn-danger btn-block" id="modal-confirm">Confirmer</button></div>`);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', ()=>{ closeModal(); onConfirm(); });
}
function showPromptModal(label, defaultValue, onSubmit){
  openModal(`
    <label class="field-label">${escapeHtml(label)}</label>
    <input type="text" id="modal-input" value="${escapeHtml(defaultValue||'')}" style="margin-bottom:14px;">
    <div class="row"><button class="btn btn-outline btn-block" id="modal-cancel">Annuler</button><button class="btn btn-primary btn-block" id="modal-submit">Valider</button></div>`);
  const input = document.getElementById('modal-input');
  const submit = ()=>{ const v = input.value; closeModal(); onSubmit(v); };
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-submit').addEventListener('click', submit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  input.focus();
}

// ================= Storage helpers =================
async function getJSON(key, shared, tokenOverride){ try{ const r = await safeStorage.get(key, shared, tokenOverride); return r && r.value ? JSON.parse(r.value) : null; }catch(e){ return null; } }
async function setJSON(key, value, shared, tokenOverride){ try{ return await safeStorage.set(key, JSON.stringify(value), shared, tokenOverride); }catch(e){ console.error(e); return false; } }
async function deleteJSON(key, shared, tokenOverride){
  const ok = await safeStorage.delete(key, shared, tokenOverride).catch(()=>false);
  if(ok) return true;
  // Repli : si l'endpoint de suppression n'existe pas encore côté serveur, on écrase
  // la valeur par null plutôt que de laisser l'ancienne donnée "fantôme" en place.
  return await setJSON(key, null, shared, tokenOverride);
}

async function loadIndex(){ const idx = await getJSON('notions-index', true); setState({ notionsIndex: idx || [] }); }
async function loadPoints(){
  if(!state.userName) return;
  const p = await getJSON('score:'+normalize(state.userName), true);
  const streak = await getJSON('user-streak', false);
  const missed = await getJSON('user-missed', false);
  setState({
    points: p && p.points ? p.points : 0,
    streak: streak || {count:0},
    missed: missed || [],
  });
}
async function addPoints(n){
  const key = 'score:'+normalize(state.userName);
  const current = await getJSON(key, true);
  const total = (current && current.points ? current.points : 0) + n;
  await setJSON(key, { name: state.userName, points: total }, true);
  setState({ points: total });
}
async function addMissed(items){
  if(!items.length) return;
  let missed = (await getJSON('user-missed', false)) || [];
  missed = [...items, ...missed].slice(0,50);
  await setJSON('user-missed', missed, false);
  setState({ missed });
}
async function updateStreak(){
  let s = (await getJSON('user-streak', false)) || {count:0, lastDate:null};
  const today = new Date().toISOString().slice(0,10);
  if(s.lastDate === today){}
  else{
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    s.count = (s.lastDate === y) ? (s.count||0)+1 : 1;
    s.lastDate = today;
    await setJSON('user-streak', s, false);
  }
  setState({ streak: s });
}

// ================= Init =================
async function init(){
  const token = getToken(), username = getUsername();
  if(token && username){
    if(await isBanned(username)){
      clearSession();
    }else{
      state.accessGranted = true; state.userName = username;
      state.isAdmin = await resolveIsAdmin(username);
    }
  }
  await loadIndex();
  if(state.userName){ await loadPoints(); await updateStreak(); }
  render();
}
async function doLogin(username, password){
  if(normalize(username)===normalize(MASTER_ADMIN_USERNAME) && password===MASTER_ADMIN_PASSWORD){
    // Le compte de secours doit quand même obtenir un vrai token signé par le serveur (via
    // /api/auth/login, en créant le compte au passage s'il n'existe pas encore) : un token
    // "maison" comme avant ('master-admin-session') est rejeté par le serveur sur chaque appel
    // protégé (IA, upload, stockage), ce qui te déconnectait dès que tu envoyais un message.
    let r = await apiLogin(MASTER_ADMIN_USERNAME, MASTER_ADMIN_PASSWORD);
    if(r.error) r = await apiRegister(MASTER_ADMIN_USERNAME, MASTER_ADMIN_PASSWORD);
    if(r.error){ showAuthError("Impossible d'ouvrir la session admin : " + r.error); return; }
    await grantSession({ token: r.token, username: MASTER_ADMIN_USERNAME, isAdmin: true });
    return;
  }
  if(await isBanned(username)){ showAuthError("Ce compte a été suspendu par l'admin."); return; }
  const r = await apiLogin(username, password);
  if(r.error){ showAuthError(r.error); return; }
  await trackUserSighting(r.username);
  // Les comptes déjà marqués admin côté serveur entrent directement (sinon personne ne
  // pourrait jamais lire le tout premier code de validation dans l'onglet Admin).
  if(r.isAdmin){ await grantSession(r); return; }
  await requestValidationCode(r);
}
async function doRegister(username, password){
  if(!username || !username.trim() || !password || password.length < 6){ showAuthError("Prénom requis, mot de passe d'au moins 6 caractères."); return; }
  if(normalize(username)===normalize(MASTER_ADMIN_USERNAME)){ showAuthError("Cet identifiant est réservé."); return; }
  if(await isBanned(username)){ showAuthError("Cet identifiant a été banni."); return; }
  const r = await apiRegister(username, password);
  if(r.error){ showAuthError(r.error); return; }
  await trackUserSighting(r.username);
  if(r.isAdmin){ await grantSession(r); return; }
  await requestValidationCode(r);
}
async function grantSession(r){
  setSession(r.token, r.username, r.isAdmin);
  const admin = await resolveIsAdmin(r.username) || !!r.isAdmin;
  setStoredIsAdmin(admin, r.username);
  setState({ accessGranted:true, userName:r.username, isAdmin: admin });
  loadPoints(); updateStreak();
}
// ================= Code de validation à la connexion =================
// À chaque tentative de connexion (ou création de compte) d'un compte non-admin, un code
// à 6 chiffres est généré et déposé dans le stockage partagé sous "login-code:<pseudo>",
// visible par l'admin dans l'onglet Admin. L'élève doit saisir ce code pour finaliser sa
// connexion. Un nouveau code écrase l'ancien à chaque tentative.
let pendingAuth = null;
async function requestValidationCode(authResult){
  const code = String(Math.floor(100000 + Math.random()*900000));
  const key = 'login-code:'+normalize(authResult.username);
  // authResult.token vient d'être délivré par /api/auth/login ou /register : on l'utilise
  // directement (au lieu de authHeaders(), qui lit localStorage — vide tant que la session
  // n'est pas encore accordée). Sans ça, cette écriture échouait en silence (401) et l'admin
  // ne voyait jamais aucun code apparaître.
  const ok = await setJSON(key, { username: authResult.username, code, createdAt: Date.now() }, true, authResult.token);
  if(!ok){ showToast("Impossible de générer le code, réessaie."); }
  pendingAuth = authResult;
  render();
}
async function submitValidationCode(){
  const input = document.getElementById('auth-valcode');
  const entered = (input ? input.value.trim() : "");
  if(!entered){ showAuthError("Entre le code fourni par l'admin."); return; }
  if(!pendingAuth) return;
  if(await isBanned(pendingAuth.username)){ pendingAuth = null; showToast("Ce compte a été suspendu par l'admin."); render(); return; }
  const key = 'login-code:'+normalize(pendingAuth.username);
  const record = await getJSON(key, true, pendingAuth.token);
  if(!record || record.code !== entered){ showAuthError("Code incorrect."); return; }
  const r = pendingAuth; pendingAuth = null;
  await deleteJSON(key, true, r.token); // le code ne sert qu'une fois
  await grantSession(r);
}
function cancelValidationCode(){ pendingAuth = null; render(); }
function showAuthError(msg){ const err = document.getElementById('auth-error'); if(err){ err.textContent = msg; err.style.display='block'; } }
function doLogout(){ clearSession(); setState({ accessGranted:false, userName:null, isAdmin:false, points:0 }); }
async function saveName(name){
  name = (name||"").trim(); if(!name) return;
  setState({ userName:name });
  await loadPoints(); await updateStreak();
}

    </div>
    <input type="text" id="auth-username" placeholder="Prénom / identifiant" style="margin-bottom:8px;">
    <input type="password" id="auth-password" placeholder="Mot de passe" style="margin-bottom:8px;">
    <div id="auth-error" style="display:none; color:var(--danger); font-size:12.5px; font-weight:600; margin-bottom:10px;"></div>
    <button class="btn btn-primary btn-block" id="auth-submit">${authTab==='login' ? 'Se connecter' : 'Créer mon compte'}</button>
  </div></div>`;
}
function bindAuthGate(){
  if(pendingAuth){
    const vBtn = document.getElementById('auth-validate-code');
    const cBtn = document.getElementById('auth-cancel-code');
    const input = document.getElementById('auth-valcode');
    if(vBtn) vBtn.addEventListener('click', submitValidationCode);
    if(cBtn) cBtn.addEventListener('click', cancelValidationCode);
    if(input){ input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitValidationCode(); }); input.focus(); }
    return;
  }
  const setTab = (tab)=>{ authTab = tab; render(); };
  const loginTab = document.getElementById('auth-tab-login'), registerTab = document.getElementById('auth-tab-register');
  if(loginTab) loginTab.addEventListener('click', ()=> setTab('login'));
  if(registerTab) registerTab.addEventListener('click', ()=> setTab('register'));
  const submit = ()=>{
    const u = document.getElementById('auth-username').value;
    const p = document.getElementById('auth-password').value;
    if(authTab==='login') doLogin(u,p); else doRegister(u,p);
  };
  const btn = document.getElementById('auth-submit');
  if(btn){
    btn.addEventListener('click', submit);
    document.getElementById('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  }
}

function quizScore(quiz){ let s=0; quiz.questions.forEach((q,qi)=>{ if(state.quizAnswers[qi]===q.correct) s++; }); return s; }

function bindNotionDetail(){

function bindQuizInteractions(){
  document.querySelectorAll('[data-qz]').forEach(b=> b.addEventListener('click', ()=>{ if(state.quizSubmitted) return; const qi=b.dataset.qz, oi=parseInt(b.dataset.opt); state.quizAnswers[qi]=oi; renderInPlace(); }));
  const submitBtn = document.getElementById('submit-quiz-btn');
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    setState({ quizSubmitted:true });
    const missedItems = [];
    state.quiz.questions.forEach((q,qi)=>{ if(state.quizAnswers[qi]!==q.correct){ missedItems.push({ question:q.question, options:q.options, correct:q.correct, explanation:q.explanation||"", source: state.quizNotionTitle||"" }); } });
    await addMissed(missedItems);
    if(state.quizIsOfficial){ const s = quizScore(state.quiz); await addPoints(s*10); showToast(`+${s*10} points !`); }
    if(state.quizNotionId){

      hist.unshift({ notionId: state.quizNotionId, title: state.quizNotionTitle, score: quizScore(state.quiz), total: state.quiz.questions.length, date: Date.now() });

      await setJSON('user-history', hist, false);

}

async function generateQuizFor(content, isOfficial, loadingKey, targetZoneId, difficulty, category, notionId, notionTitle){
  setState({ loading: loadingKey || 'quiz' });
  try{
    const diffTxt = difficulty==='facile' ? "facile (questions simples, vocabulaire de base)" : difficulty==='difficile' ? "difficile (questions qui demandent de la réflexion et des subtilités)" : "de niveau moyen";
    const text = await askClaude([{ role:"user", content: `Voici du contenu d'un cours ou d'un exercice scolaire :\n\n"""${content}"""\n\nGénère un QCM de 4 questions de difficulté ${diffTxt} pour tester la compréhension.${scientificInstruction(category)} Réponds UNIQUEMENT avec un objet JSON, sans texte autour, au format exact :\n{"questions":[{"question":"...","options":["...","...","...","..."],"correct":0,"explanation":"..."}]}` }], { maxTokens: 1300 });
    const quiz = parseJsonLoose(text);
    if(!quiz || !quiz.questions || !quiz.questions.length){ showToast("Le quiz n'a pas pu être généré, réessaie."); setState({ loading:false }); return; }
    setState({ quiz, quizAnswers:{}, quizSubmitted:false, quizIsOfficial:isOfficial, quizNotionId:notionId, quizNotionTitle:notionTitle, loading:false });
    if(targetZoneId){ setTimeout(()=>{ const zone=document.getElementById(targetZoneId); if(zone){ zone.innerHTML = renderQuizBlock(quiz, targetZoneId, isOfficial); bindQuizInteractions(); } },0); }
  }catch(e){ console.error(e); showToast("Erreur pendant la génération du quiz."); setState({ loading:false }); }
}
async function correctExercise(i, answer){
  if(!answer || !answer.trim()){ showToast("Écris d'abord une réponse."); return; }
  setState({ loading: 'exo'+i });
  try{
    const ex = state.currentNotion.exercises[i];
    const text = await askClaude([{ role:"user", content:`Voici un exercice scolaire :\n"""${ex.text}"""\n\nVoici la réponse d'un élève :\n"""${answer}"""\n\nCorrige cette réponse.${scientificInstruction(state.currentNotion.category)} Réponds UNIQUEMENT en JSON au format :\n{"correct": true/false, "feedback": "explication claire et bienveillante en français"}` }], { maxTokens: 600 });
    const result = parseJsonLoose(text);
    if(!result){ showToast("Correction impossible, réessaie."); setState({loading:false}); return; }
    const newRes = {...(state.exoResult||{})}; newRes[i] = { correct: !!result.correct, feedback: result.feedback || "" };
    setState({ exoResult: newRes, loading:false });
    if(result.correct){ await addPoints(5); showToast("Bonne réponse ! +5 points"); }
  }catch(e){ console.error(e); showToast("Erreur pendant la correction."); setState({ loading:false }); }
}

let flashState = { subject:"", cards:[], index:0, correctCount:0, started:false };
function renderFlashcardsHub(){

  }

  </div>
  <div id="flash-feedback" style="margin-top:12px;"></div>`;

function bindFlashcardsHub(){
  const genBtn = document.getElementById('flash-generate');
  if(genBtn){
    const subjInput = document.getElementById('flash-subject');
    if(subjInput) subjInput.addEventListener('input', e=> flashState.subject = e.target.value);
    genBtn.addEventListener('click', generateFlashSeries);
  }
  const rev = document.getElementById('review-mistakes-btn');
  if(rev) rev.addEventListener('click', ()=>{
    const cards = state.missed.map(m=> ({ statement: m.question + " — " + m.options[m.correct], correct:true, explanation: m.explanation }));
    if(!cards.length){ showToast("Aucune erreur enregistrée."); return; }
    flashState = { subject:"Révision des erreurs", cards, index:0, correctCount:0, started:true };
    renderInPlace();
  });
  const yes = document.getElementById('flash-yes'), no = document.getElementById('flash-no');
  if(yes) yes.addEventListener('click', ()=> answerFlash(true));
  if(no) no.addEventListener('click', ()=> answerFlash(false));
  const restart = document.getElementById('flash-restart');
  if(restart) restart.addEventListener('click', ()=>{ flashState = { subject:"", cards:[], index:0, correctCount:0, started:false }; renderInPlace(); });
  const cardEl = document.getElementById('flash-card-el');
  if(cardEl){
    let startX = null;
    cardEl.addEventListener('touchstart', e=>{ startX = e.touches[0].clientX; });
    cardEl.addEventListener('touchend', e=>{
      if(startX===null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if(Math.abs(dx) > 60){ answerFlash(dx < 0 ? true : false); }
      startX = null;
    });
  }
}
async function generateFlashSeries(){
  if(!flashState.subject.trim()){ showToast("Écris d'abord un sujet."); return; }
  setState({ loading:'flash' });
  const q = normalize(flashState.subject);
  const matching = state.notionsIndex.filter(n=> normalize(n.title).includes(q) || normalize(n.category).includes(q) || normalize(n.tags||"").includes(q));
  let combinedContent = "";
  for(const m of matching.slice(0,5)){ const full = await getJSON('notion:'+m.id, true); if(full) combinedContent += `\n\n### ${full.title}\n${full.content}`; }
  if(!combinedContent){ combinedContent = flashState.subject; }
  try{
    const text = await askClaude([{ role:"user", content:`Voici du contenu scolaire sur le sujet "${flashState.subject}" :\n"""${combinedContent}"""\n\nGénère une série de 8 flashcards de type vrai/faux.${scientificInstruction(flashState.subject)} Réponds UNIQUEMENT en JSON :\n{"cards":[{"statement":"affirmation à évaluer","correct":true,"explanation":"courte explication"}]}` }], { maxTokens: 1400 });
    const parsed = parseJsonLoose(text);
    setState({ loading:false });
    if(!parsed || !parsed.cards || !parsed.cards.length){ showToast("Impossible de générer la série."); return; }
    flashState = { subject: flashState.subject, cards: parsed.cards, index:0, correctCount:0, started:true };
    renderInPlace();
  }catch(e){ console.error(e); setState({ loading:false }); showToast("Erreur pendant la génération."); }
}
function answerFlash(userSaysTrue){
  const card = flashState.cards[flashState.index];
  const isRight = userSaysTrue === !!card.correct;
  if(isRight) flashState.correctCount++;
  const fb = document.getElementById('flash-feedback');
  if(fb) fb.innerHTML = `<div class="card" style="padding:12px; font-size:13px; background:${isRight?'#E4F7ED':'#FBEAEB'};">${isRight?'✅ Correct':'❌'} — ${escapeHtml(card.explanation||"")}</div>`;
  setTimeout(()=>{ flashState.index++; renderInPlace(); }, 900);
}

function renderChat(){

function bindChat(){

async function sendChatMessage(){
  const input = document.getElementById('chat-input'); if(!input) return;
  const text = input.value.trim(); if(!text) return; input.value="";
  try{
    const msgs = (await getJSON('chat-messages', true)) || [];
    msgs.push({ id: uid(), name: state.userName, text, time: Date.now(), reports:0 });
    while(msgs.length > 100) msgs.shift();
    await setJSON('chat-messages', msgs, true);
    lastRenderedMsgCount = -1; await refreshChat();
  }catch(e){ console.error(e); }
}
async function refreshChat(){
  const msgs = (await getJSON('chat-messages', true)) || [];
  if(msgs.length === lastRenderedMsgCount) return;
  lastRenderedMsgCount = msgs.length;
  const list = document.getElementById('chat-list'); if(!list) return;
  if(msgs.length===0){ list.innerHTML = `<div class="empty">💬<br>Aucun message pour l'instant.</div>`; return; }
  list.innerHTML = msgs.map(m=>`
    <div class="msg ${m.name===state.userName?'mine':''}">
      <div class="msg-name">${escapeHtml(m.name)}${m.reports>0 ? ' ⚠️' : ''}</div>
      <div class="msg-bubble">${escapeHtml(m.text)}</div>
      <div class="msg-actions">
        ${m.name!==state.userName ? `<button class="msg-action-btn" data-report="${m.id}">Signaler</button>` : ""}
        ${state.isAdmin ? `<button class="msg-action-btn" data-del-msg="${m.id}">🗑️ Supprimer</button>` : ""}
      </div>
    </div>`).join("");
  list.scrollTop = list.scrollHeight;
  document.querySelectorAll('[data-report]').forEach(b=> b.addEventListener('click', ()=> reportMessage(b.dataset.report)));
  document.querySelectorAll('[data-del-msg]').forEach(b=> b.addEventListener('click', ()=> showConfirmModal("Supprimer ce message ?", ()=> deleteMessage(b.dataset.delMsg))));
}
async function reportMessage(id){
  let msgs = (await getJSON('chat-messages', true)) || [];
  msgs = msgs.map(m=> m.id===id ? {...m, reports:(m.reports||0)+1} : m);
  await setJSON('chat-messages', msgs, true);
  showToast("Message signalé.");
  lastRenderedMsgCount = -1; refreshChat();
}
async function deleteMessage(id){
  let msgs = (await getJSON('chat-messages', true)) || [];
  msgs = msgs.filter(m=> m.id!==id);
  await setJSON('chat-messages', msgs, true);
  lastRenderedMsgCount = -1; refreshChat();
}
function startChatAfterRender(){ refreshChat(); stopChatPolling(); chatPollHandle = setInterval(()=>{ if(state.screen==='chat' && !state.currentNotion) refreshChat(); }, 4000); }
function stopChatPolling(){ if(chatPollHandle){ clearInterval(chatPollHandle); chatPollHandle=null; } }

function bindAdmin(){
  if(!state.isAdmin){
    const lBtn = document.getElementById('admin-login');
    const cInput = document.getElementById('admin-code');
    if(lBtn && cInput){
      lBtn.addEventListener('click', async ()=>{
        const code = cInput.value.trim();
        const ok = await checkAdminCode(code);
        if(!ok){ showToast("Code incorrect."); return; }
        const list = (await getJSON('admin-usernames', true)) || [];
        const norm = normalize(state.userName);
        if(!list.includes(norm)){ list.push(norm); await setJSON('admin-usernames', list, true); }
        setStoredIsAdmin(true, state.userName);
        setState({ isAdmin:true });
        showToast("Accès admin activé !");
      });
    }
    return;
  }
  const drop = document.getElementById('admin-drop'), file = document.getElementById('admin-file');
  if(drop && file){
    drop.addEventListener('click', ()=> file.click());
    file.addEventListener('change', async ()=>{ if(!file.files.length) return; await handleAdminImages(Array.from(file.files)); });
  }
  document.querySelectorAll('[data-del-notion]').forEach(b=> b.addEventListener('click', ()=>{
    showConfirmModal("Supprimer cette notion ? Cette action est définitive.", async ()=>{
      const id = b.dataset.delNotion;
      const previousIndex = state.notionsIndex;
      const newIndex = previousIndex.filter(n=>n.id!==id);
      setState({ notionsIndex:newIndex }); // mise à jour optimiste de l'UI
      const okIndex = await setJSON('notions-index', newIndex, true);
      if(!okIndex){
        // échec réel de la sauvegarde : on annule visuellement pour ne pas mentir à l'admin
        setState({ notionsIndex:previousIndex });
        showToast("❌ Échec de la suppression (connexion/serveur). Réessaie.");
        return;
      }
      // Nettoyage : retirer cette notion des "notions liées" des autres fiches, puis supprimer l'objet lui-même
      const removed = await getJSON('notion:'+id, true);
      if(removed && removed.linkedTo && removed.linkedTo.length){
        for(const link of removed.linkedTo){
          const other = await getJSON('notion:'+link.id, true);
          if(other){ other.linkedTo = (other.linkedTo||[]).filter(l=>l.id!==id); await setJSON('notion:'+link.id, other, true); }
        }
      }
      await deleteJSON('notion:'+id, true);
      showToast("Notion supprimée.");
    });
  }));
  document.querySelectorAll('[data-edit-notion]').forEach(b=> b.addEventListener('click', ()=> startEditNotion(b.dataset.editNotion)));
  document.querySelectorAll('[data-cancel-edit]').forEach(b=> b.addEventListener('click', ()=>{ editingNotionId=null; editingNotionData=null; renderInPlace(); }));
  document.querySelectorAll('[data-save-edit]').forEach(b=> b.addEventListener('click', ()=> saveEditNotion(b.dataset.saveEdit)));
  document.querySelectorAll('[data-link-notion]').forEach(b=> b.addEventListener('click', ()=> linkNotionFlow(b.dataset.linkNotion)));
  const exportBtn = document.getElementById('export-overview-btn');
  if(exportBtn) exportBtn.addEventListener('click', showOverview);
  const renameCatBtn = document.getElementById('rename-category-btn');
  if(renameCatBtn) renameCatBtn.addEventListener('click', renameCategoryFlow);
  loadPendingZone();
  loadLoginCodesZone();
  loadUsersListZone();
  if(isMasterAdmin()){
    const revealBtn = document.getElementById('reveal-admin-code-btn');
    if(revealBtn) revealBtn.addEventListener('click', async ()=>{
      const stored = await getJSON('admin-code', true);
      const code = (stored && stored.code) || "0000";
      const disp = document.getElementById('admin-code-display');
      if(disp) disp.textContent = code;
    });
    const changeBtn = document.getElementById('change-admin-code-btn');
    if(changeBtn) changeBtn.addEventListener('click', ()=>{
      showPromptModal("Nouveau code admin", "", async (val)=>{
        val = (val||"").trim();
        if(!val){ showToast("Code vide, annulé."); return; }
        const ok = await setJSON('admin-code', { code: val }, true);
        showToast(ok ? "Code admin mis à jour." : "❌ Échec de la mise à jour du code.");
      });
    });
    loadAdminsListZone();
  }
}

async function startEditNotion(id){
  setState({ loading:true });
  const notion = await getJSON('notion:'+id, true);
  setState({ loading:false });
  if(!notion){ showToast("❌ Impossible de charger cette notion (problème de connexion)."); return; }
  editingNotionId = id; editingNotionData = notion; renderInPlace();
}
async function saveEditNotion(id){
  const newTitle = document.getElementById('edit-title-'+id).value.trim();
  const newCat = document.getElementById('edit-category-'+id).value.trim();
  const newTags = document.getElementById('edit-tags-'+id).value.trim();
  if(!newTitle){ showToast("Le titre est obligatoire."); return; }
  const notion = await getJSON('notion:'+id, true);
  if(!notion){ showToast("❌ Notion introuvable (problème de connexion)."); return; }
  notion.title = newTitle; notion.category = newCat || notion.category; notion.tags = newTags;
  const okNotion = await setJSON('notion:'+id, notion, true);
  const idx = state.notionsIndex.map(n=> n.id===id ? {...n, title:notion.title, category:notion.category, tags:notion.tags} : n);
  const okIndex = await setJSON('notions-index', idx, true);
  if(!okNotion || !okIndex){
    showToast("❌ Échec de l'enregistrement (connexion/serveur). Réessaie.");
    return; // on laisse le formulaire ouvert pour ne pas perdre la saisie
  }
  editingNotionId = null; editingNotionData = null;
  setState({ notionsIndex:idx }); showToast("Notion mise à jour.");
}
async function renameCategoryFlow(){
  const categories = [...new Set(state.notionsIndex.map(n=> n.category).filter(Boolean))].sort();
  if(!categories.length){ showToast("Aucune catégorie pour l'instant."); return; }
  openModal(`
    <label class="field-label">Quelle catégorie / classe veux-tu renommer ?</label>
    <p style="color:var(--muted); font-size:12px; margin:0 0 10px;">Ex : passer "Terminale A" en "Terminale D" partout d'un coup.</p>
    <div style="max-height:300px; overflow-y:auto; margin:8px 0 12px;">
      ${categories.map(c=>`<button class="option-btn" data-cat-target="${escapeHtml(c)}">${escapeHtml(c)} <span style="color:var(--muted); font-weight:400;">(${state.notionsIndex.filter(n=>n.category===c).length} notion(s))</span></button>`).join("")}
    </div>
    <button class="btn btn-outline btn-block" id="modal-cancel">Annuler</button>`);
  const mCancel = document.getElementById('modal-cancel');
  if(mCancel) mCancel.addEventListener('click', closeModal);
  document.querySelectorAll('[data-cat-target]').forEach(b=> b.addEventListener('click', ()=>{
    const oldCat = b.dataset.catTarget;
    closeModal();
    showPromptModal(`Nouveau nom pour "${oldCat}"`, oldCat, async (newCatRaw)=>{
      const newCat = (newCatRaw||"").trim();
      if(!newCat || newCat===oldCat) return;
      setState({ loading:true });
      const affected = state.notionsIndex.filter(n=> n.category===oldCat);
      let allOk = true;
      for(const n of affected){
        const full = await getJSON('notion:'+n.id, true);
        if(full){ full.category = newCat; const ok = await setJSON('notion:'+n.id, full, true); if(!ok) allOk = false; }
        else allOk = false;
      }
      const newIndex = state.notionsIndex.map(n=> n.category===oldCat ? {...n, category:newCat} : n);
      const okIdx = await setJSON('notions-index', newIndex, true);
      setState({ notionsIndex:newIndex, loading:false });
      if(!allOk || !okIdx) showToast("⚠️ Renommage partiel — vérifie la liste des notions.");
      else showToast(`Catégorie renommée en "${newCat}" (${affected.length} notion(s)).`);
    });
  }));
}

async function linkNotionFlow(id){
  const others = state.notionsIndex.filter(n=> n.id!==id);
  if(!others.length){ showToast("Aucune autre notion."); return; }
  openModal(`
    <label class="field-label">Lier à quelle notion ?</label>

async function handleAdminImages(files){
  const zone = document.getElementById('admin-form-zone');
  if(!zone) return;
  zone.innerHTML = `<div class="empty"><span class="spinner spinner-dark"></span><br>Analyse de ${files.length} image(s)...</div>`;
  try{
    const contentBlocks = [];
    for(const f of files){ const base64 = await fileToBase64(f); contentBlocks.push({ type:"image", source:{ type:"base64", media_type: f.type||"image/jpeg", data: base64 } }); }
    const existingTitles = state.notionsIndex.map(n=> `"${n.title}" (${n.category})`).join(", ") || "aucune";
    contentBlocks.push({ type:"text", text: `Ces images montrent un cours ou un exercice. Notions déjà existantes : ${existingTitles}. Réponds UNIQUEMENT en JSON :\n{"title":"titre court","category":"matière / chapitre","tags":"mots-clés","content":"résumé structuré","exercise":"énoncé","possibleLink":"titre exact d'une notion existante si lié, sinon chaîne vide"}` });
    const text = await askClaude([{ role:"user", content: contentBlocks }], { maxTokens: 1100 });
    const parsed = parseJsonLoose(text);
    if(!parsed){ zone.innerHTML = `<div class="empty">Analyse impossible.</div>`; return; }
    window.__pendingNotion = parsed;
    zone.innerHTML = `<div class="card">
      ${parsed.possibleLink ? `<div class="pending-item">🔗 Lié à <strong>${escapeHtml(parsed.possibleLink)}</strong>.</div>` : ""}
      <label class="field-label">Titre</label><input type="text" id="edit-title" value="${escapeHtml(parsed.title||"")}" style="margin:0 0 12px;">
      <label class="field-label">Catégorie</label><input type="text" id="edit-category" value="${escapeHtml(parsed.category||"")}" style="margin:0 0 12px;">
      <label class="field-label">Tags</label><input type="text" id="edit-tags" value="${escapeHtml(parsed.tags||"")}" style="margin:0 0 12px;">
      <label class="field-label">Contenu</label><textarea id="edit-content" style="margin:0 0 12px; min-height:120px;">${escapeHtml(parsed.content||"")}</textarea>
      <label class="field-label">Exercice (optionnel)</label><textarea id="edit-exercise" style="margin:0 0 12px;">${escapeHtml(parsed.exercise||"")}</textarea>
      <button class="btn btn-primary btn-block" id="save-notion-btn">Ajouter à la base</button>
    </div>`;
    const saveBtn = document.getElementById('save-notion-btn');
    if(saveBtn) saveBtn.addEventListener('click', saveNewNotion);
  }catch(e){ console.error(e); zone.innerHTML = `<div class="empty">❌ ${escapeHtml(e.message || "Erreur inconnue.")}</div>`; }
}
async function saveNewNotion(){
  const title = document.getElementById('edit-title').value.trim();
  const category = document.getElementById('edit-category').value.trim() || "Général";
  const tags = document.getElementById('edit-tags').value.trim();
  const content = document.getElementById('edit-content').value.trim();
  const exerciseText = document.getElementById('edit-exercise').value.trim();
  if(!title || !content){ showToast("Titre et contenu obligatoires."); return; }
  const id = uid();
  const exercises = exerciseText ? [{ id: uid(), text: exerciseText }] : [];
  let linkedTo = [];
  const possibleLink = window.__pendingNotion && window.__pendingNotion.possibleLink;
  if(possibleLink){
    const match = state.notionsIndex.find(n=> normalize(n.title)===normalize(possibleLink));
    if(match){
      linkedTo = [{ id: match.id, title: match.title }];
      const other = await getJSON('notion:'+match.id, true);
      if(other){ other.linkedTo = [...(other.linkedTo||[]), {id, title}]; await setJSON('notion:'+match.id, other, true); }
    }
  }
  await setJSON('notion:'+id, { id, title, category, tags, content, exercises, linkedTo }, true);
  const newIndex = [...state.notionsIndex, { id, title, category, tags, exerciseCount: exercises.length }];
  await setJSON('notions-index', newIndex, true);
  setState({ notionsIndex:newIndex }); showToast("Notion ajoutée !");
  const aForm = document.getElementById('admin-form-zone');
  if(aForm) aForm.innerHTML = "";
}

async function approvePending(id, pending){
  const item = pending.find(p=>p.id===id); if(!item) return;
  const newId = uid();
  await setJSON('notion:'+newId, { id:newId, title:item.title, category:item.category, tags:item.tags||"", content:item.content, exercises:[], linkedTo:[] }, true);
  const newIndex = [...state.notionsIndex, { id:newId, title:item.title, category:item.category, tags:item.tags||"", exerciseCount:0 }];
  await setJSON('notions-index', newIndex, true);
  const remaining = pending.filter(p=>p.id!==id);
  await setJSON('pending-notions', remaining, true);
  setState({ notionsIndex:newIndex }); showToast("Notion validée !");
  loadPendingZone();
}
async function rejectPending(id, pending){
  const remaining = pending.filter(p=>p.id!==id);
  await setJSON('pending-notions', remaining, true);
  showToast("Refusé."); loadPendingZone();
}

  const list = await safeStorage.list('score:', true).catch(()=>null);
  const nbUsers = list && list.keys ? list.keys.length : 0;
  const totalExos = state.notionsIndex.reduce((s,n)=> s+(n.exerciseCount||0), 0);
  zone.innerHTML = `<div class="card">
    <div style="font-size:13.5px; margin-bottom:6px;">📚 Notions : <strong>${state.notionsIndex.length}</strong></div>
    <div style="font-size:13.5px; margin-bottom:6px;">📝 Exercices : <strong>${totalExos}</strong></div>
    <div style="font-size:13.5px;">👥 Utilisateurs : <strong>${nbUsers}</strong></div>
  </div>`;
}

// ---------- Boot ----------
init();
</script>
</body>
</html>
